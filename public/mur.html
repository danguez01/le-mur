<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15101f">
<title>Le Mur</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%B8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar"><a href="/" id="evt">Le Mur</a><span class="pill" id="count">0</span></div>
<div id="empty" class="empty" hidden>Le mur est vide… sois le premier à poster ! 📸</div>
<main class="grid" id="grid"></main>
<a class="btn fab" href="/">＋ Ajouter</a>
<script src="/common.js"></script>
<script>
(async () => {
  const grid = document.getElementById('grid'), empty = document.getElementById('empty'), count = document.getElementById('count');
  let cfg = { eventName: 'Le Mur', reactions: [] };
  try { cfg = await Mur.config(); } catch (_) {}
  document.getElementById('evt').textContent = cfg.eventName;
  document.title = cfg.eventName + ' — Le Mur';
  const opts = (isNew) => ({ isNew, reactions: cfg.reactions, onReact: react, onDelete: del });

  const refresh = () => { const n = grid.children.length; count.textContent = n + (n > 1 ? ' souvenirs' : ' souvenir'); empty.hidden = n > 0; };
  async function react(id, e) {
    Mur.markReacted(id, e);
    try { await Mur.api('/api/posts/' + id + '/react', { method: 'POST', body: JSON.stringify({ emoji: e }) }); } catch (_) {}
  }
  async function del(id) {
    if (!confirm('Supprimer ta publication du mur ?')) return;
    try { await Mur.api('/api/posts/' + id, { method: 'DELETE', headers: { 'x-owner-token': Mur.owner() } }); Mur.delMine(id); remove(id); Mur.toast('Supprimée ✔'); }
    catch (e) { Mur.toast(e.message); }
  }
  const find = (id) => grid.querySelector('[data-id="' + CSS.escape(id) + '"]');
  const remove = (id) => { const el = find(id); if (el) el.remove(); refresh(); };

  try {
    const list = await Mur.api('/api/posts');
    const hl = new URLSearchParams(location.search).get('new');
    list.sort((a, b) => b.createdAt - a.createdAt).forEach((p) => grid.appendChild(Mur.polaroid(p, opts(p.id === hl))));
    if (hl) history.replaceState(null, '', '/mur');
  } catch (e) { Mur.toast('Connexion difficile… on réessaie'); }
  refresh();

  Mur.stream({
    post: (p) => { if (find(p.id)) return; grid.prepend(Mur.polaroid(p, opts(true))); refresh(); },
    delete: (d) => remove(d.id),
    react: (d) => { const el = find(d.id); if (el) Mur.renderReactions(el, d.reactions, cfg.reactions, react); },
    open: async () => { // après une coupure : resynchroniser
      try { const list = await Mur.api('/api/posts'); const ids = new Set(list.map((p) => p.id));
        [...grid.children].forEach((el) => { if (!ids.has(el.dataset.id)) el.remove(); });
        list.sort((a, b) => a.createdAt - b.createdAt).forEach((p) => { if (!find(p.id)) grid.prepend(Mur.polaroid(p, opts(false))); });
        refresh(); } catch (_) {}
    }
  });
  setInterval(() => document.querySelectorAll('.age').forEach((a) => { a.textContent = Mur.ago(+a.dataset.t); }), 30000);
})();
</script>
</body>
</html>
